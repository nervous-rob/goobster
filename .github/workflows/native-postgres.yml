name: Native Postgres

# Issue #340 (installer epic #315, installer plan P4.7). Proves the native
# PostgreSQL option on real distributions: the manager CLI drives the real
# privileged helper, which runs the real apt or dnf, the pg_* tools and
# systemctl, beside a pre-existing distribution cluster that must come out
# untouched. `scripts/native-postgres-real-distro.js` is the journey: a port
# conflict is refused, a cluster is provisioned on the next port in a custom
# directory, the application role is NOSUPERUSER with the extensions and the
# schema, stop/start, repair, relocate, keep-data then remove-data retirement,
# and a before/after fingerprint of the pre-existing cluster.
#
# Hosts: ubuntu-24.04 (and ubuntu-24.04-arm when the repository has arm64
# runners) are the systemd case. Containers: debian:12 is the Debian family
# without systemd (pg_ctlcluster), rockylinux/rockylinux:9-ubi-init the Red Hat family with
# systemd as PID 1, which the helper requires there.
# Documentation: documentation/native_postgres.md.

on:
  workflow_dispatch:
    inputs:
      linux_arm64:
        description: 'Include ubuntu-24.04-arm. Untick if the repository has no access to GitHub-hosted arm64 runners; the job would otherwise queue forever.'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'apps/manager/native/**'
      - 'apps/manager/privileged/**'
      - 'apps/manager/engine/kinds/nativePostgres.js'
      - 'packages/core/db/native/**'
      - 'scripts/native-postgres-real-distro.js'
      - 'documentation/native_postgres.md'
      - '.github/workflows/native-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'apps/manager/native/**'
      - 'apps/manager/privileged/**'
      - 'packages/core/db/native/**'
      - 'scripts/native-postgres-real-distro.js'
      - '.github/workflows/native-postgres.yml'

permissions:
  contents: read

concurrency:
  group: native-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        env:
          INCLUDE_ARM64: ${{ github.event_name != 'workflow_dispatch' && vars.PACKAGING_PROOF_LINUX_ARM64 != 'false' || inputs.linux_arm64 == true }}
        run: |
          entries='{"os":"ubuntu-24.04"}'
          if [ "$INCLUDE_ARM64" = "true" ]; then
            entries="$entries"',{"os":"ubuntu-24.04-arm"}'
          else
            echo "::notice::ubuntu-24.04-arm is NOT part of this run; that host stays unverified."
          fi
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  host:
    name: native postgres (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: A distribution cluster that already exists (the one that must stay untouched)
        run: |
          # The runner image ships a PostgreSQL cluster stopped; start it so there is a live "main" on 5432.
          sudo systemctl start postgresql || sudo pg_ctlcluster "$(pg_lsclusters -h | awk 'NR==1{print $1}')" main start
          pg_lsclusters
          sudo ss -ltnp | grep 5432
      - name: Provision, port conflict, stop/start, repair, relocate, keep/remove, foreign cluster untouched
        run: sudo -E env "PATH=$PATH" node scripts/native-postgres-real-distro.js 2>&1 | tee "$RUNNER_TEMP/native-postgres-${{ matrix.os }}.log"; exit "${PIPESTATUS[0]}"
        env:
          GOOBSTER_PROOF_DATADIR: /srv/goobster-pg
      - name: Nothing of ours is left
        if: always()
        run: |
          if pg_lsclusters -h | awk '{print $2}' | grep -q '^goobster'; then echo '::error::a goobster cluster is still registered'; exit 1; fi
          pg_lsclusters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-postgres-${{ matrix.os }}
          path: ${{ runner.temp }}/native-postgres-*.log
          if-no-files-found: warn
          retention-days: 14

  container:
    name: native postgres (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:12', family: debian }
          - { image: 'rockylinux/rockylinux:9-ubi-init', family: rhel }
    steps:
      - uses: actions/checkout@v5
      - name: Start the container (systemd is PID 1 for the Red Hat family)
        run: |
          if [ "${{ matrix.family }}" = rhel ]; then
            docker run -d --name proof --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD":/work -w /work "${{ matrix.image }}" /usr/sbin/init
            sleep 8
            docker exec proof systemctl is-system-running --wait || true
          else
            docker run -d --name proof -v "$PWD":/work -w /work "${{ matrix.image }}" sleep infinity
          fi
      - name: Node 22 and the tools the helper and the journey need
        run: |
          if [ "${{ matrix.family }}" = rhel ]; then
            docker exec proof bash -c 'dnf -y install curl tar gzip xz which iproute procps-ng sudo && curl -fsSL https://rpm.nodesource.com/setup_22.x | bash - && dnf -y install nodejs'
          else
            docker exec proof bash -c 'apt-get update -q && apt-get install -y -q curl ca-certificates gnupg iproute2 procps sudo postgresql-common && curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y -q nodejs'
          fi
          docker exec proof bash -c 'cd /work && node --version && npm ci --no-audit --no-fund'
      - name: A distribution cluster that already exists (the one that must stay untouched)
        run: |
          if [ "${{ matrix.family }}" = rhel ]; then
            docker exec proof bash -c 'dnf -y install postgresql-server && postgresql-setup --initdb && systemctl enable --now postgresql && ss -ltn | grep 5432'
          else
            # The default cluster the distribution's own package makes; there is no systemd in this container.
            docker exec proof bash -c 'apt-get install -y -q postgresql && pg_ctlcluster "$(pg_lsclusters -h | awk "NR==1{print \$1}")" main start && pg_lsclusters'
          fi
      - name: Provision, port conflict, stop/start, repair, relocate, keep/remove, foreign cluster untouched
        run: docker exec -e GOOBSTER_PROOF_DATADIR=/srv/goobster-pg proof bash -c 'cd /work && node scripts/native-postgres-real-distro.js' 2>&1 | tee "$RUNNER_TEMP/native-postgres-${{ matrix.family }}.log"; exit "${PIPESTATUS[0]}"
      - if: always()
        run: docker logs proof 2>&1 | tail -50; docker rm -f proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-postgres-${{ matrix.family }}-container
          path: ${{ runner.temp }}/native-postgres-*.log
          if-no-files-found: warn
          retention-days: 14
