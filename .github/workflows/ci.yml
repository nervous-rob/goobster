name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run for the push before it, so a
# branch never holds runners for a commit nobody will merge. Runs on main and
# manual runs each get their own group and always finish: the updater's CI
# gate (scripts/auto-update.sh) reads a cancelled check run as a failed commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared by the unit jobs: Node + lockfile npm cache + a static ffmpeg
# binary (./.github/actions/setup-ffmpeg — the Observatory render tests stitch
# real PNGs into an mp4, and ffmpeg is not on the runner image). Do NOT
# apt-get install ffmpeg here — that pulls ~80 media libraries and has hung
# GitHub-hosted runners for 1–6 hours after the SQLite/Postgres split (two
# jobs hammering apt at once). npm ci itself is already ~10s with
# setup-node's cache.
env:
  NODE_VERSION: '22'

jobs:
  # Everything that does not depend on the database engine, once. It is its
  # own job so a lint error and a failing test both show up from one push.
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/setup-ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Smoke require (every module must load with minimal config)
        run: npm run smoke

      - name: Typecheck React client
        run: npm run typecheck:web

      - name: Build React client
        run: npm run build:web

      # Every spec in exactly one group, every group in exactly one shard of
      # each engine job below (tests/ciGroups.js audits this file).
      - name: Inventory test groups
        run: node scripts/check-test-groups.js

  # Each engine runs every named group, split across parallel shards sized
  # from measured durations (ADR 0007). A shard is a matrix entry: `groups`
  # is what it runs, `shard` is only its label. The two engines are split
  # differently because Postgres is slower. To move a group, move its id
  # between the `groups` lists of one engine job; the inventory fails if a
  # group is in no shard of an engine, or in two.
  #
  # Named groups stay ordinary job steps on purpose. A composite action
  # collapses to one "Unit tests" parent in the Actions step list, which hid
  # names, statuses, and timings. A step whose group belongs to another shard
  # shows as skipped. Shared runners: scripts/run-test-group.js.
  test-sqlite:
    name: test (sqlite, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: install
            groups: [install]
          - shard: core + domains
            groups: [core, chat, portal, knowledge, projects, voice, games, privacy]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/setup-ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # frontendChunks (portal) reads the real build. It can build for itself,
      # as it does on Postgres, but then a build error only skips its checks.
      - name: Build React client
        if: contains(matrix.groups, 'portal')
        run: npm run build:web

      - name: Core infrastructure
        id: core
        if: contains(matrix.groups, 'core')
        continue-on-error: true
        run: node scripts/run-test-group.js core

      - name: Installer and lifecycle
        id: install
        if: contains(matrix.groups, 'install')
        continue-on-error: true
        run: node scripts/run-test-group.js install

      - name: Chat and AI
        id: chat
        if: contains(matrix.groups, 'chat')
        continue-on-error: true
        run: node scripts/run-test-group.js chat

      - name: Portal and collaboration
        id: portal
        if: contains(matrix.groups, 'portal')
        continue-on-error: true
        run: node scripts/run-test-group.js portal

      - name: Knowledge and memory
        id: knowledge
        if: contains(matrix.groups, 'knowledge')
        continue-on-error: true
        run: node scripts/run-test-group.js knowledge

      - name: Projects and autonomy
        id: projects
        if: contains(matrix.groups, 'projects')
        continue-on-error: true
        run: node scripts/run-test-group.js projects

      - name: Voice and media
        id: voice
        if: contains(matrix.groups, 'voice')
        continue-on-error: true
        run: node scripts/run-test-group.js voice

      - name: Games and economy
        id: games
        if: contains(matrix.groups, 'games')
        continue-on-error: true
        run: node scripts/run-test-group.js games

      - name: Privacy and execution safety
        id: privacy
        if: contains(matrix.groups, 'privacy')
        continue-on-error: true
        run: node scripts/run-test-group.js privacy

      - name: Publish test group summary
        if: always()
        run: node scripts/publish-test-group-summary.js

      - name: Fail if any unit group failed
        if: always()
        run: node scripts/require-test-groups.js ${{ join(matrix.groups, ' ') }}

  test-postgres:
    name: test (postgres, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            groups: [core]
          - shard: install
            groups: [install]
          - shard: portal + projects
            groups: [portal, projects]
          - shard: privacy + chat + knowledge + voice + games
            groups: [privacy, chat, knowledge, voice, games]
    env:
      # 127.0.0.1, not localhost: the service container publishes IPv4 only,
      # and a dual-stack connect that fails reports a blank AggregateError.
      GOOBSTER_DB_URL: postgres://goobster:goobster@127.0.0.1:5432/goobster
      GOOBSTER_PG_TEST_ISOLATE: '1'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: goobster
          POSTGRES_USER: goobster
          POSTGRES_PASSWORD: goobster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goobster -d goobster"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/setup-ffmpeg

      # The backup/restore suite shells out to pg_dump / pg_restore, which
      # refuse a server of a newer major version. The runner image ships the
      # Ubuntu default (16); the service container is 17, so install the
      # matching client and put its bin dir first on PATH (pg_wrapper would
      # otherwise pick the runner's own cluster version).
      #
      # The runner already has the pgdg signing key (postgresql-common) but
      # not the source, so the quick path writes the source and refreshes only
      # that one index. A full `apt-get update` ran three times here before
      # (ours, the pgdg script's, ours again) and cost 15-20s per job. If the
      # quick path does not produce pg_dump 17, the original steps still run.
      - name: Install PostgreSQL 17 client tools
        run: |
          pg17=/usr/lib/postgresql/17/bin
          keyring=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          quick() {
            [ -f "$keyring" ] || return 1
            codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
            echo "deb [signed-by=$keyring] https://apt.postgresql.org/pub/repos/apt $codename-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg-ci.list >/dev/null
            sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/pgdg-ci.list \
              -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 || return 1
            sudo apt-get install -y --no-install-recommends postgresql-client-17 || return 1
            [ -x "$pg17/pg_dump" ]
          }
          if ! quick; then
            echo "::notice::quick pgdg path did not work; using the full apt path"
            sudo rm -f /etc/apt/sources.list.d/pgdg-ci.list
            if ! ls /etc/apt/sources.list.d/pgdg* >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends postgresql-common
              sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            fi
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client-17
          fi
          echo "$pg17" >> "$GITHUB_PATH"
          "$pg17/pg_dump" --version

      # The service database is thrown away with the job, so nothing needs to
      # survive a crash. Every suite applies the whole schema to its own
      # Postgres schema, which is commit-heavy DDL. Best effort: a refusal
      # only means the suites run at the default speed.
      - name: Turn off durability on the throwaway database
        run: |
          /usr/lib/postgresql/17/bin/psql "$GOOBSTER_DB_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()" \
            || echo "::warning::could not turn off durability; the suites run at the default speed"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Core infrastructure
        id: core
        if: contains(matrix.groups, 'core')
        continue-on-error: true
        run: node scripts/run-test-group.js core

      - name: Installer and lifecycle
        id: install
        if: contains(matrix.groups, 'install')
        continue-on-error: true
        run: node scripts/run-test-group.js install

      - name: Chat and AI
        id: chat
        if: contains(matrix.groups, 'chat')
        continue-on-error: true
        run: node scripts/run-test-group.js chat

      - name: Portal and collaboration
        id: portal
        if: contains(matrix.groups, 'portal')
        continue-on-error: true
        run: node scripts/run-test-group.js portal

      - name: Knowledge and memory
        id: knowledge
        if: contains(matrix.groups, 'knowledge')
        continue-on-error: true
        run: node scripts/run-test-group.js knowledge

      - name: Projects and autonomy
        id: projects
        if: contains(matrix.groups, 'projects')
        continue-on-error: true
        run: node scripts/run-test-group.js projects

      - name: Voice and media
        id: voice
        if: contains(matrix.groups, 'voice')
        continue-on-error: true
        run: node scripts/run-test-group.js voice

      - name: Games and economy
        id: games
        if: contains(matrix.groups, 'games')
        continue-on-error: true
        run: node scripts/run-test-group.js games

      - name: Privacy and execution safety
        id: privacy
        if: contains(matrix.groups, 'privacy')
        continue-on-error: true
        run: node scripts/run-test-group.js privacy

      - name: Publish test group summary
        if: always()
        run: node scripts/publish-test-group-summary.js

      - name: Fail if any unit group failed
        if: always()
        run: node scripts/require-test-groups.js ${{ join(matrix.groups, ' ') }}

  # Optional live provider checks. Mocked provider suites always run in the
  # unit jobs above. This job never disables that coverage: missing secrets
  # skip the matching live file (and report the env var name), invalid keys
  # fail the test. Fork PRs do not receive repository secrets, so this job is
  # limited to trusted main pushes and manual dispatch.
  test-live:
    name: test (live integrations)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Report credential status
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/report-live-credentials.js

      - name: Live provider tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/run-live-tests.js

      - name: Publish live test summary
        if: always()
        run: node scripts/publish-test-group-summary.js

  # Required working-Bubblewrap environment. GitHub-hosted runners refuse
  # unprivileged user namespaces (uid_map), so unit jobs do not install
  # bwrap. This job runs the planted-secret canary as root on the VM and
  # again inside the sandbox deployment image.
  sandbox-isolation:
    name: sandbox isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Isolation canary on the runner (root)
        run: |
          sudo bwrap --ro-bind-try /usr /usr --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /bin /bin \
            --tmpfs /tmp --die-with-parent -- /usr/bin/true
          sudo -E env PATH="$PATH" HOME="$HOME" "$(command -v node)" \
            scripts/sandbox-isolation-smoke.js

      - name: Confirm Dockerfiles install bubblewrap
        run: |
          grep -q bubblewrap Dockerfile
          grep -q bubblewrap deploy/sandbox.Dockerfile

      - name: Build sandbox image
        run: docker build -f deploy/sandbox.Dockerfile -t goobster-sandbox:ci .

      - name: Isolation canary inside the image
        run: >
          docker run --rm --privileged
          --security-opt apparmor=unconfined
          --security-opt seccomp=unconfined
          -e GOOBSTER_SANDBOX_REQUIRE_STRONG_ISOLATION=1
          goobster-sandbox:ci
          node scripts/sandbox-isolation-smoke.js

  # Browser journeys against createWebAppApp in webapp.devMode. Separate
  # from both-engines (that aggregator is the dual-DB gate; see ADR 0006).
  # Chromium is installed here so the job is self-contained.
  #
  # The journeys run one worker against one server, about 17 minutes end to
  # end, so they are split into shards that run as parallel jobs, each with
  # its own server and throwaway database. scripts/e2e-shard.js plans the
  # split from the spec files on disk and e2e/shard-durations.json, so a new
  # spec is picked up with no registration and every spec runs in exactly one
  # shard. To change the shard count, change the list below and nothing else.
  test-e2e:
    name: test (playwright, ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build React client
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Portal journeys
        env:
          # A shard takes about 4 minutes of journeys today. Past 8 it warns,
          # well before the job limit, so a shard is added in time.
          E2E_SHARD_WARN_SECONDS: '480'
        run: node scripts/e2e-shard.js ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Keep the traces of a failed shard
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # One check for the journeys as a whole, under the name the single job had,
  # so a ruleset (ADR 0004) or a person waiting on CI has one thing to watch.
  e2e:
    name: test (playwright)
    if: always()
    needs: [test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every journey shard must succeed
        run: |
          echo "test (playwright, shards)=${{ needs.test-e2e.result }}"
          test "${{ needs.test-e2e.result }}" = success

  # Installer #339: the Docker-managed Postgres option against a real daemon
  # and the pinned pgvector image (documentation/docker_postgres.md). The fake
  # docker proves what the manager asks for in the unit groups; this job proves
  # Docker does it: pull by digest, create, health, provision, repair, remove.
  # The tests clean up their own labelled resources. Extra coverage, not part
  # of the both-engines aggregator.
  test-docker-postgres:
    name: test (docker postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Docker daemon
        run: docker info

      - name: PostgreSQL 17 client tools (backup-tools check; best effort)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client-17 || echo "::warning::postgresql-client-17 not installed; BACKUP_TOOLS_* is exercised as missing"
          # Ubuntu's pg_wrapper keeps answering with the image's default client (16); point the manager
          # at the 17 binaries the way an operator would (documentation/backup_and_restore.md).
          if [ -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            echo "GOOBSTER_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
            /usr/lib/postgresql/17/bin/pg_dump --version
          else
            pg_dump --version || true
          fi

      - name: Docker Postgres specs against the real daemon
        env:
          GOOBSTER_DOCKER_TESTS: '1'
        run: npx jest tests/dockerDaemon.test.js tests/dockerPostgresKinds.test.js tests/dockerPostgresRoutes.test.js

      - name: Nothing of ours is left behind
        if: always()
        run: |
          docker ps -a --filter label=io.goobster.installation --format '{{.Names}}' | tee /tmp/left-containers
          docker volume ls --filter label=io.goobster.installation --format '{{.Name}}' | tee /tmp/left-volumes
          test ! -s /tmp/left-containers && test ! -s /tmp/left-volumes

  # Single required check so main cannot advance when one engine is still
  # running or the sandbox image isolation smoke has not passed. PR #201
  # merged while test (postgres) was unfinished; requiring this job closes
  # that window. See ADR 0006. A matrix job's result is success only when
  # every shard succeeded. `if: always()` is deliberate: a cancelled run must
  # report this check as failed, never as skipped. Live integrations are
  # extra coverage and are not part of this aggregator (ADR 0007).
  both-engines:
    name: both engines
    if: always()
    needs: [static-checks, test-sqlite, test-postgres, sandbox-isolation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Static checks, engine jobs and isolation smoke must succeed
        run: |
          echo "static checks=${{ needs.static-checks.result }}"
          echo "test (sqlite)=${{ needs.test-sqlite.result }}"
          echo "test (postgres)=${{ needs.test-postgres.result }}"
          echo "sandbox isolation=${{ needs.sandbox-isolation.result }}"
          test "${{ needs.static-checks.result }}" = success
          test "${{ needs.test-sqlite.result }}" = success
          test "${{ needs.test-postgres.result }}" = success
          test "${{ needs.sandbox-isolation.result }}" = success
