name: CI

on:
  push:
    branches: [main]
  pull_request:

# Shared by both engine jobs: Node + lockfile npm cache + a static ffmpeg
# binary (./.github/actions/setup-ffmpeg — the Observatory render tests stitch
# real PNGs into an mp4, and ffmpeg is not on the runner image). Do NOT
# apt-get install ffmpeg here — that pulls ~80 media libraries and has hung
# GitHub-hosted runners for 1–6 hours after the SQLite/Postgres split (two
# jobs hammering apt at once). npm ci itself is already ~10s with
# setup-node's cache.
env:
  NODE_VERSION: '22'

jobs:
  test-sqlite:
    name: test (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/setup-ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Smoke require (every module must load with minimal config)
        run: npm run smoke

      - name: Typecheck React client
        run: npm run typecheck:web

      - name: Build React client
        run: npm run build:web

      - name: Unit tests (SQLite)
        run: npm test

  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: goobster
          POSTGRES_USER: goobster
          POSTGRES_PASSWORD: goobster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goobster -d goobster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/setup-ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (Postgres)
        env:
          GOOBSTER_DB_URL: postgres://goobster:goobster@localhost:5432/goobster
          GOOBSTER_PG_TEST_ISOLATE: '1'
        run: npm test

  # Browser journeys against createWebAppApp in webapp.devMode. Separate
  # from both-engines (that aggregator is the dual-DB gate; see ADR 0006).
  # Chromium is installed here so the job is self-contained.
  test-e2e:
    name: test (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build React client
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Portal journeys
        run: npm run test:e2e

  # Single required check so main cannot advance when one engine is still
  # running. PR #201 merged while test (postgres) was unfinished; requiring
  # this job (or both named jobs) closes that window. See ADR 0006.
  both-engines:
    name: both engines
    if: always()
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Both engine jobs must succeed
        run: |
          echo "test (sqlite)=${{ needs.test-sqlite.result }}"
          echo "test (postgres)=${{ needs.test-postgres.result }}"
          test "${{ needs.test-sqlite.result }}" = success
          test "${{ needs.test-postgres.result }}" = success
