name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both database adapters run the full suite: SQLite is the lite
        # profile's engine, Postgres the split deployment's (reactive port
        # spec §7). Neither dialect may rot.
        engine: [sqlite, postgres]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: goobster
          POSTGRES_USER: goobster
          POSTGRES_PASSWORD: goobster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goobster -d goobster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ffmpeg mirrors the runtime environment; some modules probe for it at load time.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.engine == 'sqlite'
        run: npm run lint

      - name: Smoke require (every module must load with minimal config)
        if: matrix.engine == 'sqlite'
        run: npm run smoke

      - name: Unit tests (SQLite)
        if: matrix.engine == 'sqlite'
        run: npm test

      - name: Unit tests (Postgres)
        if: matrix.engine == 'postgres'
        env:
          GOOBSTER_DB_URL: postgres://goobster:goobster@localhost:5432/goobster
          GOOBSTER_PG_TEST_ISOLATE: '1'
        run: npm test
