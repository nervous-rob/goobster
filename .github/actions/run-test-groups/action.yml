name: Run grouped Jest suites
description: >
  Inventory unit specs against tests/ciGroups.js, then run each named group.
  Later groups still run after an earlier group fails; the last step fails
  the job if any group failed.

inputs:
  results-dir:
    description: Where to write per-group JSON summaries
    required: false
    default: ${{ github.workspace }}/test-results/groups

runs:
  using: composite
  steps:
    - name: Inventory test groups
      shell: bash
      run: node scripts/check-test-groups.js

    - name: Core infrastructure
      id: core
      continue-on-error: true
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/run-test-group.js core

    - name: Chat and AI
      id: chat
      continue-on-error: true
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/run-test-group.js chat

    - name: Portal and collaboration
      id: portal
      continue-on-error: true
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/run-test-group.js portal

    - name: Knowledge and memory
      id: knowledge
      continue-on-error: true
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/run-test-group.js knowledge

    - name: Projects and autonomy
      id: projects
      continue-on-error: true
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/run-test-group.js projects

    - name: Voice and media
      id: voice
      continue-on-error: true
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/run-test-group.js voice

    - name: Games and economy
      id: games
      continue-on-error: true
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/run-test-group.js games

    - name: Privacy and execution safety
      id: privacy
      continue-on-error: true
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/run-test-group.js privacy

    - name: Publish test group summary
      if: always()
      shell: bash
      env:
        GOOBSTER_TEST_RESULTS_DIR: ${{ inputs.results-dir }}
      run: node scripts/publish-test-group-summary.js

    - name: Fail if any unit group failed
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "core=${{ steps.core.outcome }}"
        echo "chat=${{ steps.chat.outcome }}"
        echo "portal=${{ steps.portal.outcome }}"
        echo "knowledge=${{ steps.knowledge.outcome }}"
        echo "projects=${{ steps.projects.outcome }}"
        echo "voice=${{ steps.voice.outcome }}"
        echo "games=${{ steps.games.outcome }}"
        echo "privacy=${{ steps.privacy.outcome }}"
        test "${{ steps.core.outcome }}" = success
        test "${{ steps.chat.outcome }}" = success
        test "${{ steps.portal.outcome }}" = success
        test "${{ steps.knowledge.outcome }}" = success
        test "${{ steps.projects.outcome }}" = success
        test "${{ steps.voice.outcome }}" = success
        test "${{ steps.games.outcome }}" = success
        test "${{ steps.privacy.outcome }}" = success
