<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1117">
<title>Shared conversation &mdash; Goobster</title>
<link rel="stylesheet" href="/app/style.css">
<link rel="icon" href="/app/icons/goobster.svg" type="image/svg+xml">
<link rel="alternate icon" href="/app/icons/icon-192.png" sizes="192x192">
</head>
<body>

<div class="share-page">
  <header class="share-header">
    <div class="brand"><img class="brand-logo" src="/app/icons/goobster.svg" alt="" width="24" height="24"> Goobster</div>
    <div id="share-meta" class="hint"></div>
  </header>
  <main id="share-main">
    <h1 id="share-title" class="share-title"></h1>
    <div id="share-log" class="chat-log share-log" aria-live="off"></div>
    <div id="share-status" class="empty">Loading shared conversation&hellip;</div>
  </main>
  <footer class="share-footer hint">
    Read-only snapshot shared from a self-hosted Goobster. The owner can revoke this link at any time.
  </footer>
</div>

<script type="module" src="/app/share.js"></script>
</body>
</html>
