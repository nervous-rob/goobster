<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Goobster's house — chat, memory, parlor, and the tools he built you. Same brain as Discord.">
  <meta name="theme-color" content="#0f1117">
  <title>Goobster</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icons/goobster.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon-180.png">
  <!-- Stable filename so a stale hashed CSS 404 cannot leave the SPA unstyled. -->
  <link rel="stylesheet" href="/app/style.css">
</head>
<body>
  <!-- Paint the device copies of theme, accent (and its berry favicon), surface, and
       navigation layout before the app mounts so a reload never flashes the defaults. Same keys as
       src/lib/theme.ts and src/lib/appearance.ts. -->
  <script>
    (function () {
      try {
        var s = window.localStorage;
        var t = s.getItem('goobster-theme');
        var light = t === 'light' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.body.classList.add('light');
        var a = s.getItem('goobster-accent');
        if (a && /^[a-z]+$/.test(a)) {
          document.documentElement.setAttribute('data-accent', a);
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.setAttribute('href', '/app/icons/berry/' + a + '.svg');
        }
        if (s.getItem('goobster-surface') === 'neutral') document.documentElement.setAttribute('data-surface', 'neutral');
        if (s.getItem('goobster-nav-layout') === 'top') document.documentElement.setAttribute('data-nav-layout', 'top');
      } catch (e) { /* private mode */ }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
