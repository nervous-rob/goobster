# Goobster `full` profile (reactive port spec §12): postgres + bot + api + sandbox + nginx.
# The lite single-container path stays at the repo-root docker-compose.yml.
#
#   cp deploy/.env.example deploy/.env   # set POSTGRES_PASSWORD + GOOBSTER_INTERNAL_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Only `web` (nginx) is published. Point a tunnel at localhost:3000.
# Put the Postgres volume on a USB SSD, not an SD card (see documentation/postgres_setup.md).

name: goobster

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: goobster
      POSTGRES_USER: goobster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goobster -d goobster"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: deploy/bot.Dockerfile
    environment:
      NODE_ENV: production
      GOOBSTER_DB_URL: postgres://goobster:${POSTGRES_PASSWORD}@postgres:5432/goobster
      GOOBSTER_INTERNAL_TOKEN: ${GOOBSTER_INTERNAL_TOKEN:?set GOOBSTER_INTERNAL_TOKEN in deploy/.env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      GOOBSTER_SANDBOX_URL: http://sandbox:3200
      GOOBSTER_RUNNER_ID: bot
    volumes:
      - ../config.json:/app/config.json:ro
      - goobster-data:/app/data
      - goobster-cache:/app/cache
      - goobster-logs:/app/logs
    networks: [internal]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  sandbox:
    build:
      context: ..
      dockerfile: deploy/sandbox.Dockerfile
    environment:
      NODE_ENV: production
      GOOBSTER_INTERNAL_TOKEN: ${GOOBSTER_INTERNAL_TOKEN}
      GOOBSTER_SANDBOX_PORT: "3200"
      GOOBSTER_SANDBOX_ENABLED: "1"
      GOOBSTER_SANDBOX_REQUIRE_STRONG_ISOLATION: "1"
    volumes:
      # Never mount config.json or the full data volume: a snippet must
      # not be able to read bot secrets or another user's project. The
      # sandbox tree (venv, overlay, runs, Observatory workspaces) is
      # the only host path the runner needs.
      - type: volume
        source: goobster-data
        target: /app/data/sandbox
        volume:
          subpath: sandbox
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # bubblewrap inside a container needs this; bot/api no longer do
    # (see documentation/code_sandbox.md). NET_ADMIN is for loopback
    # inside --unshare-net (RTM_NEWADDR); without it bwrap still
    # isolates the filesystem and skips the net namespace.
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      NODE_ENV: production
      GOOBSTER_DB_URL: postgres://goobster:${POSTGRES_PASSWORD}@postgres:5432/goobster
      GOOBSTER_GATEWAY_URL: http://bot:3000
      GOOBSTER_INTERNAL_TOKEN: ${GOOBSTER_INTERNAL_TOKEN}
      GOOBSTER_API_PORT: "3100"
      GOOBSTER_SANDBOX_URL: http://sandbox:3200
      GOOBSTER_RUNNER_ID: api
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
    volumes:
      - ../config.json:/app/config.json:ro
      - goobster-data:/app/data
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started
      sandbox:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "3000:80"
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge: {}

volumes:
  pgdata:
  goobster-data:
  goobster-cache:
  goobster-logs:
