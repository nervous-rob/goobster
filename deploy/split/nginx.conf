# Front door for the house. Static /app/ from this container; API,
# Activity, health, and WebSockets from the upstream named in
# $GOOBSTER_UPSTREAM (core:3000 today, api:3000 after the split).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    location /health {
        proxy_pass http://$GOOBSTER_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://$GOOBSTER_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /activity {
        proxy_pass http://$GOOBSTER_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /app/vendor/katex/ {
        proxy_pass http://$GOOBSTER_UPSTREAM;
        proxy_set_header Host $host;
    }

    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
    }

    location = / {
        return 302 /app/;
    }
}
